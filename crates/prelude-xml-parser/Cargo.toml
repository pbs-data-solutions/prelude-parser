[package]
name = "prelude-xml-parser"
version = "0.11.1"
description = "Deserialize Prelude EDC native XML files into Rust stucts."
documentation = "https://docs.rs/prelude-xml-parser"
readme = "README.md"
keywords = ["prelude-edc", "xml", "deserialization", "pyo3"]
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
python = ["dep:pyo3"]

[dependencies]
chrono.workspace = true
pyo3 = { workspace = true, optional = true }
quick-xml = { workspace = true, features = ["serde", "serialize"] }
rayon = "1.12.0"
serde.workspace = true
serde_json = "1.0.150"
thiserror.workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
insta = { version = "1.47.2", features = ["yaml"] }
tempfile = "3.27.0"

[[bench]]
name = "parse_benchmark"
harness = false
